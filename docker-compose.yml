version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dealflow360-db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: dealflow360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d dealflow360"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: odoo:18.0
    container_name: dealflow360-odoo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ./dealflow_odoo:/mnt/extra-addons/dealflow_odoo
      - ./odoo.conf:/etc/odoo/odoo.conf
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo

  api:
    build: .
    container_name: dealflow360-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://odoo:odoo@db:5432/dealflow360
      SECRET_KEY: replace-with-a-secure-random-secret-key-dealflow360-min-32-chars
      DEBUG: "true"
      ODOO_URL: http://web:8069
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
